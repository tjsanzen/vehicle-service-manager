add_service_entry:
  name: Log service
  description: Log maintenance for a vehicle. Resets the interval for each item included.
  fields:
    vehicle_id:
      name: Vehicle ID
      description: The vehicle's ID (shown in the vehicle_id attribute of any of its sensors).
      required: true
      selector:
        text:
    entry_date:
      name: Date
      required: true
      selector:
        date:
    odometer:
      name: Odometer
      required: true
      selector:
        number:
          min: 0
          max: 9999999
          mode: box
          unit_of_measurement: mi
    services:
      name: Items serviced
      required: true
      selector:
        select:
          multiple: true
          options:
            - label: "Oil change"
              value: oil
            - label: "Tire rotation"
              value: tire_rotation
            - label: "Multi-point inspection"
              value: inspection
            - label: "Wiper blades"
              value: wipers
            - label: "Engine air filter"
              value: air_filter
            - label: "Cabin air filter"
              value: cabin_filter
            - label: "Brake fluid"
              value: brake_fluid
            - label: "Coolant"
              value: coolant
            - label: "Transmission fluid"
              value: transmission
            - label: "Spark plugs"
              value: spark_plugs
            - label: "Differential fluid"
              value: differential
            - label: "Fuel filter"
              value: fuel_filter
            - label: "Battery"
              value: battery
            - label: "Registration"
              value: registration
            - label: "State inspection"
              value: state_inspection
    shop:
      name: Shop
      description: Who did the work (shop name, dealer, or DIY).
      required: false
      selector:
        text:
    cost:
      name: Cost
      description: Total paid, including parts, labor and tax.
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          mode: box
          unit_of_measurement: "$"
    notes:
      name: Notes
      required: false
      selector:
        text:
          multiline: true

update_odometer:
  name: Update odometer
  description: Set a vehicle's odometer reading. Lower readings are ignored unless allowed.
  fields:
    vehicle_id:
      name: Vehicle ID
      required: true
      selector:
        text:
    odometer:
      name: Odometer
      required: true
      selector:
        number:
          min: 0
          max: 9999999
          mode: box
          unit_of_measurement: mi
    allow_decrease:
      name: Allow lower reading
      description: Use to correct a reading that was entered too high.
      required: false
      default: false
      selector:
        boolean:

add_repair:
  name: Log repair
  description: Log a repair or wear item (brakes, battery, etc.).
  fields:
    vehicle_id:
      name: Vehicle ID
