            - label: "Rotors – front"
              value: rotors_front
            - label: "Rotors – rear"
              value: rotors_rear
            - label: "Alignment"
              value: alignment
            - label: "Engine"
              value: engine
            - label: "Transmission / drivetrain"
              value: transmission_drivetrain
            - label: "Cooling system"
              value: cooling
            - label: "Heating / A/C"
              value: hvac
            - label: "Timing belt"
              value: timing_belt
            - label: "Battery"
              value: battery
            - label: "Starter / alternator"
              value: starter_alternator
            - label: "Exhaust"
              value: exhaust
            - label: "Electrical"
              value: electrical
            - label: "Body / glass"
              value: body_glass
            - label: "Other"
              value: other
    description:
      name: Description
      required: false
      selector:
        text:
    shop:
      name: Shop
      description: Who did the work (shop name, dealer, or DIY).
      required: false
      selector:
        text:
    cost:
      name: Cost
      description: Total paid, including parts, labor and tax.
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          mode: box
          unit_of_measurement: "$"

add_tire:
  name: Log tires
  description: Log new tires or a tread depth measurement. Depths are in 32nds of an inch.
  fields:
    vehicle_id:
      name: Vehicle ID
      description: The vehicle's ID (shown in the vehicle_id attribute of any of its sensors).
      required: true
      selector:
        text:
    entry_date:
      name: Date
      required: true
      selector:
        date:
    odometer:
      name: Odometer
      required: true
      selector:
        number:
          min: 0
          max: 9999999
          mode: box
          unit_of_measurement: mi
    tire_type:
      name: Tire type
      required: true
      selector:
        select:
          options:
            - label: All-season
              value: all_season
            - label: Summer
              value: summer
            - label: Winter
              value: winter
            - label: All-terrain
              value: all_terrain
    axle:
      name: Position
      required: true
      selector:
        select:
          options:
            - label: All four
              value: all
            - label: Front
              value: front
            - label: Rear
              value: rear
    size:
      name: Size
      description: e.g. 225/65R17
      required: false
      selector:
        text:
    brand:
      name: Brand
      required: false
      selector:
        text:
    model:
      name: Tire model
      required: false
      selector:
        text:
    dot:
      name: DOT date code
      description: Last 4 digits of the DOT code (week and year), e.g. 2324.
      required: false
      selector:
        text:
    lf:
      name: Tread left front (32nds)
      required: false
      selector:
        number:
          min: 0
          max: 20
          step: 0.5
    rf:
      name: Tread right front (32nds)
      required: false
      selector:
        number:
          min: 0
          max: 20
          step: 0.5
    lr:
      name: Tread left rear (32nds)
      required: false
      selector:
        number:
          min: 0
          max: 20
          step: 0.5
    rr:
      name: Tread right rear (32nds)
      required: false
      selector:
        number:
          min: 0
          max: 20
          step: 0.5
    shop:
      name: Shop
      description: Who did the work (shop name, dealer, or DIY).
      required: false
      selector:
        text:
    cost:
      name: Cost
      description: Total paid, including parts, labor and tax.
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          mode: box
          unit_of_measurement: "$"
